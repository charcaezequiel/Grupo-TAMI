name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

      - name: Ejecutar pruebas
        run: npm test

# El smoke test necesita una base de datos real y se ejecuta aparte:
#   SMOKE_URL=https://<dominio> npm run smoke
# No se incluye acá para no exponer credenciales de Supabase en los flujos.
