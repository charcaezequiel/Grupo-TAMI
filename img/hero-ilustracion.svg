<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Dos personas mayores conversan sonrientes con una tableta que muestra el escudo de TAMI">
  <rect x="16" y="16" width="688" height="388" rx="36" fill="#DEF2F8"/>
  <circle cx="92" cy="86" r="34" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="646" cy="352" r="52" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="654" cy="84" r="10" fill="#007A87" opacity="0.35"/>
  <circle cx="74" cy="324" r="8" fill="#007A87" opacity="0.35"/>

  <!-- Globo de diálogo -->
  <g transform="translate(438,46)">
    <rect x="0" y="0" width="222" height="82" rx="26" fill="#FFFFFF" stroke="#007A87" stroke-width="3"/>
    <path d="M70 82 L56 106 L100 82 Z" fill="#FFFFFF" stroke="#007A87" stroke-width="3" stroke-linejoin="round"/>
    <text x="111" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0A4B5C">¡Ahora puedo!</text>
    <text x="111" y="64" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#007A87">a mi ritmo, sin miedo</text>
  </g>

  <!-- Mesa -->
  <rect x="52" y="318" width="616" height="26" rx="13" fill="#0A4B5C"/>

  <!-- Mujer mayor -->
  <g>
    <path d="M132 214 Q132 150 196 150 Q260 150 260 214 L260 240 L132 240 Z" fill="#B9C6CC"/>
    <circle cx="196" cy="182" r="44" fill="#F2C6A0"/>
    <path d="M152 176 Q156 132 196 132 Q238 132 240 176 Q220 158 196 158 Q172 158 152 176 Z" fill="#C4CFD4"/>
    <circle cx="180" cy="184" r="4.5" fill="#1F2D33"/>
    <circle cx="212" cy="184" r="4.5" fill="#1F2D33"/>
    <path d="M178 202 Q196 214 214 202" fill="none" stroke="#8A4B3A" stroke-width="4" stroke-linecap="round"/>
    <rect x="118" y="238" width="156" height="92" rx="46" fill="#007A87"/>
    <path d="M258 270 Q300 276 322 296" fill="none" stroke="#007A87" stroke-width="30" stroke-linecap="round"/>
    <path d="M134 270 Q108 276 96 288" fill="none" stroke="#007A87" stroke-width="30" stroke-linecap="round"/>
  </g>

  <!-- Hombre mayor -->
  <g>
    <path d="M462 224 Q462 166 520 166 Q578 166 578 224 L578 246 L462 246 Z" fill="#A7B4BA"/>
    <circle cx="520" cy="192" r="42" fill="#E7B389"/>
    <path d="M480 186 Q482 144 520 144 Q560 144 562 186 Q542 166 520 166 Q498 166 480 186 Z" fill="#B6C1C6"/>
    <circle cx="505" cy="194" r="4.5" fill="#1F2D33"/>
    <circle cx="535" cy="194" r="4.5" fill="#1F2D33"/>
    <path d="M504 212 Q520 222 536 212" fill="none" stroke="#8A4B3A" stroke-width="4" stroke-linecap="round"/>
    <rect x="452" y="244" width="146" height="86" rx="43" fill="#E0A526"/>
    <path d="M462 276 Q428 282 400 298" fill="none" stroke="#E0A526" stroke-width="30" stroke-linecap="round"/>
    <path d="M584 276 Q610 280 622 290" fill="none" stroke="#E0A526" stroke-width="30" stroke-linecap="round"/>
  </g>

  <!-- Tableta con TAMI -->
  <g transform="translate(300,204)">
    <rect x="0" y="0" width="176" height="116" rx="14" fill="#0A4B5C"/>
    <rect x="10" y="10" width="156" height="96" rx="8" fill="#EBF8FA"/>
    <path d="M88 24 L112 34 C112 62, 88 78, 88 80 C88 78, 64 62, 64 34 Z" fill="#007A87" stroke="#0A4B5C" stroke-width="2"/>
    <path d="M76 48 L85 57 L102 38" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0A4B5C" letter-spacing="2">TAMI</text>
  </g>

  <!-- Escudo lateral -->
  <g transform="translate(40,196)">
    <path d="M36 0 L72 15 C72 52, 36 70, 36 72 C36 70, 0 52, 0 15 Z" fill="#0A4B5C" stroke="#007A87" stroke-width="3"/>
    <path d="M22 34 L31 43 L50 22" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
