<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%" aria-label="Logo Oficial TAMI - Tecnología Amigable para Mayores e Inclusiva">
  <defs>
    <!-- Sombra suave para dar volumen institucional -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0A4B5C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Contenedor Base con Bordes Redondeados (Paleta Cian Glacial) -->
  <rect width="500" height="140" rx="20" fill="#EBF8FA" stroke="#BEE3F8" stroke-width="1.5" />

  <!-- ISOTIPO: Escudo y Dispositivo Seguro -->
  <g transform="translate(25, 15)" filter="url(#soft-shadow)">
    <!-- Escudo Exterior -->
    <path d="M 55 8 L 95 26 C 95 72, 55 100, 55 104 C 55 100, 15 72, 15 26 Z" 
          fill="#0A4B5C" stroke="#007A87" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Dispositivo / Smartphone Interno -->
    <rect x="38" y="32" width="34" height="48" rx="6" fill="#FFFFFF" stroke="#007A87" stroke-width="3"/>
    
    <!-- Botón / Altavoz del Dispositivo -->
    <line x1="48" y1="37" x2="62" y2="37" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="55" cy="73" r="2.5" fill="#007A87"/>

    <!-- Tilde / Checkmark de Autonomía y Seguridad -->
    <path d="M 46 54 L 52 60 L 65 46" fill="none" stroke="#2F855A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- TEXTO PRINCIPAL: TAMI -->
  <text x="145" y="68" font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#0A4B5C" letter-spacing="3">
    TAMI
  </text>

  <!-- LÍNEA SEPARADORA ESTILIZADA -->
  <line x1="145" y1="80" x2="460" y2="80" stroke="#007A87" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- SUBTEXTO INSTITUCIONAL / BAJADA -->
  <text x="145" y="102" font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#007A87" letter-spacing="0.8">
    Tecnología Amigable e Inclusiva
  </text>
  <text x="145" y="120" font-family="'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#4A4A4A" letter-spacing="0.5">
    Alfabetización &amp; Protección Digital
  </text>
</svg>
