  <!-- Tilde de Autonomía y Aprendizaje Seguro -->
  <path d="M 27 32 L 30 35 L 37 27" fill="none" stroke="#2F855A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
