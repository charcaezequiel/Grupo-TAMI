<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Favicon TAMI">
  <!-- Fondo Circular del Icono de Pestaña -->
  <circle cx="32" cy="32" r="30" fill="#EBF8FA" stroke="#007A87" stroke-width="2" />

  <!-- Escudo de Seguridad Integrado -->
  <path d="M 32 10 L 50 18 C 50 40, 32 52, 32 54 C 32 52, 14 40, 14 18 Z" 
        fill="#0A4B5C" stroke="#007A87" stroke-width="2" stroke-linejoin="round"/>

  <!-- Dispositivo / Móvil Interno -->
