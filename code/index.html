<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TAMI - Tecnología Amigable para Mayores e Inclusiva. Reducir la brecha digital y mitigar riesgos de fraude en adultos mayores.">
  <meta name="theme-color" content="#0A4B5C">
  <title>TAMI | Tecnología Amigable para Mayores</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header" role="banner">
    <img src="../resources/img/logo-tami.png" alt="Logo TAMI" class="header__logo">
    <nav class="nav" aria-label="Navegación principal">
      <ul class="nav__list">
        <li class="nav__item"><a href="#" class="nav__link">Inicio</a></li>
        <li class="nav__item"><a href="#" class="nav__link">Cursos</a></li>
        <li class="nav__item"><a href="#" class="nav__link">Prevención de fraude</a></li>
        <li class="nav__item"><a href="#" class="nav__link">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido-principal" class="main" role="main">
    <section class="hero" aria-labelledby="hero-titulo">
      <h1 id="hero-titulo" class="hero__titulo">Bienvenido a TAMI</h1>
      <p class="hero__texto">Tecnología amigable para cerrar la brecha digital y protegerte de las estafas en línea.</p>
      <button class="btn btn--primario" id="btn-acceder" type="button">Comenzar ahora</button>
    </section>

    <section class="mensaje" id="zona-mensaje" aria-live="polite" hidden>
      <p class="mensaje__texto" id="texto-mensaje"></p>
    </section>

    <section class="seccion" aria-labelledby="cursos-titulo">
      <h2 id="cursos-titulo" class="seccion__titulo">Cursos disponibles</h2>
      <div class="seccion__lista" id="lista-cursos"></div>
    </section>

    <section class="seccion" aria-labelledby="alertas-titulo">
      <h2 id="alertas-titulo" class="seccion__titulo">Alertas de fraude</h2>
      <ul class="seccion__lista seccion__lista--puntos" id="lista-alertas"></ul>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <p class="footer__texto">&copy; 2026 TAMI - ET N&deg;20 "Carolina Muzilli". Todos los derechos reservados.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
