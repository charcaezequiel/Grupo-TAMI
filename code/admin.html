<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - TAMI</title>
  <link rel="icon" type="image/svg+xml" href="../img/icono.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-marca { display: block; width: 100%; max-width: 280px; height: auto; margin: 0 auto 24px; }
    .admin-header__marca { display: flex; align-items: center; gap: 14px; }
    .admin-header__icono { width: 46px; height: 46px; flex: 0 0 auto; border-radius: 50%; background: #fff; }
    .admin-header { background: linear-gradient(135deg, #0A4B5C 0%, #007A87 100%); color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
    .admin-header h1 { margin: 0; font-size: 24px; }
    .admin-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .admin-card { background: white; border: 1px solid #D6E4E7; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .admin-card h3 { margin: 0 0 10px 0; color: #0A4B5C; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .admin-card .numero { font-size: 32px; font-weight: bold; color: #007A87; }
    .admin-section { background: white; border: 1px solid #D6E4E7; border-radius: 12px; padding: 25px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .admin-section h2 { margin: 0 0 20px 0; color: #0A4B5C; font-size: 20px; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th, .admin-table td { padding: 12px; text-align: left; border-bottom: 1px solid #D6E4E7; }
    .admin-table th { background: #F4F8F9; color: #0A4B5C; font-weight: 600; font-size: 13px; text-transform: uppercase; }
    .admin-table tr:hover { background: #F4F8F9; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .badge-admin { background: #FFE5E5; color: #D32F2F; }
    .badge-editor { background: #E3F2FD; color: #1976D2; }
    .badge-analista { background: #E8F5E9; color: #388E3C; }
    .badge-moderador { background: #FFF3E0; color: #F57C00; }
    .badge-usuario { background: #F5F5F5; color: #616161; }
    .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-primary { background: #007A87; color: white; }
    .btn-primary:hover { background: #0A4B5C; }
    .btn-danger { background: #D32F2F; color: white; }
    .btn-success { background: #388E3C; color: white; }
    .login-admin { max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 16px; border: 1px solid #D6E4E7; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .login-admin h1 { text-align: center; color: #0A4B5C; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #0A4B5C; font-weight: 600; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #D6E4E7; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
  </style>
</head>
<body style="background: #F4F8F9; margin: 0; font-family: Arial, Helvetica, sans-serif;">
  <div id="loginView" class="login-admin">
    <img
      class="admin-marca"
      src="../img/logo.svg"
      alt="TAMI: Tecnología Amigable para Mayores e Inclusiva"
      width="500"
      height="140"
    >
    <h1>🔐 Acceso Administrador</h1>
    <form id="loginAdminForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="adminEmail" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="adminPass" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Ingresar al Panel</button>
    </form>
    <p id="loginMsg" style="text-align: center; color: #D32F2F; margin-top: 15px;"></p>
  </div>

  <div id="adminView" style="display: none;">
    <header class="admin-header">
      <div class="admin-header__marca">
        <img
          class="admin-header__icono"
          src="../img/icono.svg"
          alt=""
          width="46"
          height="46"
          aria-hidden="true"
        >
        <div>
          <h1>🛡️ Panel de Administración TAMI</h1>
          <p style="margin: 5px 0 0 0; opacity: 0.9;">Control de Acceso Basado en Roles (RBAC)</p>
        </div>
      </div>
      <button class="btn" style="background: white; color: #0A4B5C;" onclick="logoutAdmin()">Cerrar Sesión</button>
    </header>

    <div class="admin-container">
      <div class="admin-grid" id="statsGrid"></div>

      <section class="admin-section">
        <h2>👥 Gestión de Usuarios</h2>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>2FA</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="usuariosTable"></tbody>
          </table>
        </div>
      </section>

      <section class="admin-section">
        <h2>📋 Logs de Auditoría (Últimos 50)</h2>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Acción</th>
                <th>Detalle</th>
                <th>IP</th>
              </tr>
            </thead>
            <tbody id="auditoriaTable"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script>
    const API = "http://localhost:3000/api";
    let currentUser = null;

    document.getElementById("loginAdminForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("adminEmail").value;
      const password = document.getElementById("adminPass").value;
      const msg = document.getElementById("loginMsg");
      msg.textContent = "";
      try {
        const res = await fetch(API + "/usuarios/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Error al iniciar sesión");
        currentUser = data;
        document.getElementById("loginView").style.display = "none";
        document.getElementById("adminView").style.display = "block";
        cargarDashboard();
        cargarUsuarios();
        cargarAuditoria();
      } catch (err) {
        msg.textContent = err.message;
      }
    });

    async function cargarDashboard() {
      try {
        const res = await fetch(API + "/admin/dashboard", { headers: { "x-usuario-id": currentUser.id } });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        const grid = document.getElementById("statsGrid");
        grid.innerHTML = `
          <div class="admin-card"><h3>Usuarios</h3><div class="numero">${data.resumen.usuarios}</div></div>
          <div class="admin-card"><h3>Cursos</h3><div class="numero">${data.resumen.cursos}</div></div>
          <div class="admin-card"><h3>Alertas</h3><div class="numero">${data.resumen.alertas}</div></div>
          <div class="admin-card"><h3>Auditoría 24h</h3><div class="numero">${data.resumen.auditoria_24h}</div></div>
        `;
      } catch (err) {
        alert(err.message);
      }
    }

    async function cargarUsuarios() {
      try {
        const res = await fetch(API + "/admin/usuarios", { headers: { "x-usuario-id": currentUser.id } });
        const data = await res.json();
        const tbody = document.getElementById("usuariosTable");
        tbody.innerHTML = data.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.nombre}</td>
            <td>${u.email}</td>
            <td><span class="badge badge-${u.role_name || 'usuario'}">${u.role_name || 'sin rol'}</span></td>
            <td>${u.is_active ? '✅ Activo' : '❌ Inactivo'}</td>
            <td>${u.twofa_enabled ? 'Sí' : 'No'}</td>
            <td><button class="btn btn-primary" onclick="cambiarEstado(${u.id}, ${!u.is_active})">${u.is_active ? 'Desactivar' : 'Activar'}</button></td>
          </tr>
        `).join("");
      } catch (err) {
        console.error(err);
      }
    }

    async function cambiarEstado(id, estado) {
      try {
        const res = await fetch(API + "/admin/usuarios/" + id + "/estado", {
          method: "PUT",
          headers: { "Content-Type": "application/json", "x-usuario-id": currentUser.id },
          body: JSON.stringify({ is_active: estado })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        alert(data.mensaje);
        cargarUsuarios();
      } catch (err) {
        alert(err.message);
      }
    }

    async function cargarAuditoria() {
      try {
        const res = await fetch(API + "/admin/auditoria?limite=50", { headers: { "x-usuario-id": currentUser.id } });
        const data = await res.json();
        const tbody = document.getElementById("auditoriaTable");
        tbody.innerHTML = data.map(a => `
          <tr>
            <td>${new Date(a.creado_en).toLocaleString('es-AR')}</td>
            <td>${a.nombre || 'N/A'} (${a.email || '-'})</td>
            <td><strong>${a.accion}</strong></td>
            <td>${a.detalle || '-'}</td>
            <td>${a.ip || '-'}</td>
          </tr>
        `).join("");
      } catch (err) {
        console.error(err);
      }
    }

    function logoutAdmin() {
      currentUser = null;
      document.getElementById("adminView").style.display = "none";
      document.getElementById("loginView").style.display = "block";
      document.getElementById("loginAdminForm").reset();
    }
  </script>
</body>
</html>
